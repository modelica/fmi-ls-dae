name: Build and test reference FMUs

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: x86_64-windows
            image: windows-2025
            arch: x86_64
          - name: aarch64-windows
            image: windows-11-arm
            arch: aarch64
          - name: x86_64-linux
            image: ubuntu-24.04
            arch: x86_64
          - name: aarch64-linux
            image: ubuntu-24.04-arm
            arch: aarch64
          - name: x86_64-darwin
            image: macos-26-intel
            arch: x86_64
          - name: aarch64-darwin
            image: macos-26
            arch: aarch64
    runs-on: ${{ matrix.image }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure CMake
      run: cmake -B build/cmake -DFMI_ARCHITECTURE=${{ matrix.arch }} reference-FMUs

    - name: Build
      run: cmake --build build/cmake --config Release

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ matrix.name }}
        path: build/cmake/fmus
        if-no-files-found: error

  merge-fmus:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: aarch64-windows
        path: dist-aarch64-windows
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: x86_64-windows
        path: dist-x86_64-windows
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: x86_64-linux
        path: dist-x86_64-linux
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: aarch64-linux
        path: dist-aarch64-linux
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: x86_64-darwin
        path: dist-x86_64-darwin
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: aarch64-darwin
        path: dist-aarch64-darwin

    - name: Merge platform FMUs
      run: python3 .ci/reference-FMUs/merge_fmus.py

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: FMI-LS-DAE-FMUs
        path: dist-merged/*.fmu
        if-no-files-found: error

  test-ode-fmus:
    strategy:
      matrix:
        include:
          - image: ubuntu-24.04
          - image: macos-26
          - image: windows-2025
    runs-on: ${{ matrix.image }}
    needs: [merge-fmus]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.x'

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: FMI-LS-DAE-FMUs
        path: fmus

    - name: Install dependencies
      run: pip install fmpy pytest

    - name: Simulate and verify SimpleDAE in ODE mode
      run: pytest .ci/reference-FMUs/test_simple_dae.py -v
      env:
        SIMPLE_DAE_FMU: fmus/SimpleDAE.fmu

    - name: Simulate and verify MassSpringOscillator in ODE mode
      run: pytest .ci/reference-FMUs/test_mass_spring_oscillator.py -v
      env:
        MASS_SPRING_OSCILLATOR_FMU: fmus/MassSpringOscillator.fmu
